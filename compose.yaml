services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:?Set POSTGRES_TEST_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:?Set POSTGRES_TEST_DB in .env}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  postgres_test_data:
